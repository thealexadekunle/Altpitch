name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  # Isolation suite and adversarial fixtures hit a REAL Neon database and REAL Claude API — same
  # "no mocks" pattern the whole test suite was built on (see tests/isolation.test.ts,
  # tests/adversarial-fixtures.test.ts). Requires the secrets above to be set in this repo's
  # Settings > Secrets > Actions, pointed at a dedicated test Neon branch — never production.
  test:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    if: ${{ vars.CI_LIVE_TESTS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:live

  # Corrections 03 §1: five fixture jobs must each yield a complete proposal end to end, one of
  # them with zero retrieved proof. A missing proposal is the P0 defect this round fixed, so this
  # job is NOT behind the CI_LIVE_TESTS_ENABLED flag — it gates every merge.
  pipeline:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:pipeline

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true # informational — see known Next.js 14.2 advisories, not a merge gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
